<rml>
    <head>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_steampunk.css" />
        <link type="text/rcss" href="../styles/steampunk.css" />

        <style>
            body
            {
                width: 190dp;
                height: 245dp;
                font-effect: outline(1dp black);
            }

            button {
                width: 100%;
            }
        </style>
    </head>

    <body id="game-character-actions" data-model="character-actions" class="window-fixed-size">
        <handle class="window-title" move_target="#document" id="window-title-text">{{name}}</handle>
        <span class="window-title-close" onclick="close"></span>

        <div id="window-content">
            <button class="default" onclick="friend">
                <str string-id="883">Add Friend</str>
            </button>

            <button class="default" onclick="party">
                <str string-id="27">Party</str>
            </button>

            <button class="default" onclick="group" data-if="group == true">
                <str string-id="253">Group</str>
            </button>

            <button class="default" data-if="group == false" disabled>
                <str string-id="253">Group</str>
            </button>

            <button class="default" onclick="trade">
                <str string-id="1429">Trade</str>
            </button>

            <button class="default" onclick="duel">
                <str string-id="1432">Duel</str>
            </button>

            <button class="default" onclick="whisper">
                <str string-id="342">Whisper</str>
            </button>

            <button class="default" onclick="ride" data-if="ride == true">
                <str string-id="1430">Ride Invite</str>
            </button>

            <button class="default" data-if="ride == false" disabled>
                <str string-id="1430">Ride Invite</str>
            </button>
        </div>
    </body>
</rml>
