        <link type="text/rcss" href="../styles/steampunk.css" />
        <style>
			body { width: 332dp; max-width: 94vw; }
			#vending-title { box-sizing: border-box; width: 100%; margin-bottom: 12dp; }
			.vending-grid { width: 260dp; }
			.vending-grid item-slot.listed { background-color: #80682080; }
			.vending-selection { display: flex; flex-direction: row; align-items: center; min-height: 28dp;	}
            /* centred: item name, then its price under it (Default UI Fixes) */
            .vending-selection { flex-direction: column; justify-content: center; }
            #selected-name { flex: 0 0 auto; width: 100%; min-width: 0; white-space: normal; overflow: visible; margin: 0; padding-top: 4dp; text-align: center; }
            .vending-selection .ui-currency { justify-content: center; margin-top: 2dp; }
            .vending-selection .ui-currency { flex: 0 0 auto; white-space: nowrap; }
			.vending-help { margin: 8dp 0; }
			#vending-state { margin-bottom: 8dp; }
			.vending-edit { text-align: center; }
			#edit-buy { margin-top: 8dp; }
		</style>
    </head>
