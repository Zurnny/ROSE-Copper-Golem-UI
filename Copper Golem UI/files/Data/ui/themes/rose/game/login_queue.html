<rml>
    <head>
        <title>Login Queue</title>

        <link type="text/template" href="../templates/window-box.html" />
        <link type="text/rcss" href="../styles/spritesheet_steampunk.css" />
        <link type="text/rcss" href="../styles/steampunk.css" />

        <style>
            body {
                width: 100%;
                height: 100%;
                text-align: center;
                font-effect: outline(1px black);
            }

            .window-box {
                width: 320dp;
                padding: 25dp;
                height: auto;
                margin: 0 auto;
            }

            #queue-title {
                font-size: 18dp;
                margin-bottom: 12dp;
            }

            #queue-position {
                font-size: 28dp;
                margin: 12dp 0;
                color: rgb(231, 154, 116);
            }

            #queue-hint {
                font-size: 11dp;
                color: #cccccc;
                margin-top: 8dp;
                margin-bottom: 16dp;
            }

            button.default {
                width: 160dp;
            }
        </style>
    </head>

    <body id="external-login-queue" data-model="login_queue_data">
        <div class="window-box">
            <p id="queue-title"><b>Server Busy</b></p>
            <p>You are in queue. Please wait.</p>
            <p id="queue-position"><b>Position: {{ position }}</b></p>
            <p id="queue-hint">Connection will continue automatically once a slot frees up.</p>
            <button class="default" onclick="cancel"><b>Cancel</b></button>
        </div>
    </body>
</rml>
