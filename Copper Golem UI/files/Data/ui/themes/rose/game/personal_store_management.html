<rml>
    <head>
        <title>Personal Store</title>

        <link type="text/template" href="../templates/window-fixed-size.html" />

        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/spritesheet_steampunk.css" />
        <link type="text/rcss" href="../styles/steampunk.css" />

        <style>
            item-slot.default { width: 40dp; height: 40dp; margin: 2dp; flex-shrink: 0; decorator: image(slot-icon); }
            .slot-grid { display: flex; flex-wrap: wrap; width: 220dp; }
            .slot-grid br { display: none; }

            body
            {
                width: 650dp;
            }

            #top-container
            {
                display: flex;
                flex-direction: row;

            }

            #button-container
            {
                text-align: center;
                width: 100%;
                margin: 5dp;
                vertical-align: middle;
            }

            #inventory-container
            {
                display: flex;
                flex-direction: column;
                justify-content:center;
                align-items:center;
                text-align: center;

                width: 50%;
                margin: 5dp;
            }

            #sell-container
            {
                display: flex;
                flex-direction: column;
                align-items:center;

                width: 50%;
                margin: 5dp;
            }

            #inventory-panel
            {
                overflow-y: auto;
                height: 352dp;
                width: 240dp;
                margin-top: 10dp;
                margin-bottom: 10dp;
            }

            .money {
                font-size: 12dp;
                color: rgb(231, 154, 116);
            }

            input#store-title
            {
                margin: 10dp;
                font-weight: 800;
                font-effect: outline(1dp black);
                text-align: center;
                color: rgb(231, 154, 116);
            }

            #store-title:disabled
            {
                color:rgb(187, 187, 187);
                opacity: 0.8;
            }

            tabset
            {
                display: inline-block;
                margin: 5dp;
                height: 400dp;
                width: 240dp;
            }

            tab.default
            {
                margin-top: 5dp;
                font-weight: 800;
                min-width: 100dp;
            }

            tabset panels panel
            {
                position: relative;
                display: block;
                justify-content:center;
                align-items:center;
                text-align: center;
            }

            button.small
            {
                min-width: 90dp;
            }

            .money-panel {
                margin: 5dp;
            }
        </style>
    </head>
