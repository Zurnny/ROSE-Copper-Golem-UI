<rml>
    <head>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/spritesheet_steampunk.css" />
        <link type="text/rcss" href="../styles/steampunk.css" />

        <style>
            body
            {
                width: 340dp;
            }

            #window-content
            {
                padding: 10dp;
                min-height: 100dp;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            #content {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }

            #content > div {
                width: 100%;
                display: flex;
                justify-content: center;
                margin-bottom: 10px;
            }
            
            #icon-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5dp;
            }

            #content > #message-container {
                display: block;
                max-height: 50vh;
                overflow-y: auto;
                text-align: center;
            }
            
            #message
            {
                display: block;
                word-break: break-word;
                font-weight: bold;
                font-effect: outline(1dp black);
            }

            #message.plain
            {
                white-space: pre-wrap;
            }

            #cancel
            {
                color: rgb(255, 211, 211);
            }

            progress {
                height: 5dp;
                width: 125dp;
            }

            .horizontal {
                background: rgba(134, 134, 134, 191);
            }

            .horizontal fill {
                background-color: rgb(255, 211, 211);
            }
        </style>
    </head>

    <!-- Each message box instance attaches this document to its own data model. -->
    <body id="common-message-box" class="window-fixed-size" onkeyup="keyup">
        <handle class="window-title" move_target="#document" id="window-title-text">&nbsp;</handle>

        <div id="window-content">
            <div id="content">
                <div id="icon-container">
                    <icon data-if="icon_class != ''" data-attr-class="icon_class" />
                </div>
                <div id="message-container"><label id="message" data-rml="message" data-class-plain="plain_text"></label></div>
                <div id="input-container"></div>
            </div>
            <button class="default" id="confirm" onclick="confirm" data-if="confirm_visible" data-attrif-disabled="!input_valid"><str data-attr-legacy-text="confirm_label" /></button>
            <button class="default" id="cancel" onclick="cancel" data-if="cancel_visible"><str data-attr-legacy-text="cancel_label" /></button>
            <div id="timer-container" data-if="timer_visible">
                <span style="display: flex; flex-direction: row; align-items: center;">
                    <img id="time-remaining-icon" data-attr-sprite="timer_warning ? 'timer-clock-warning' : 'timer-clock'" />
                    <span>
                        <div id="time-remaining-text">{{ seconds_remaining }} seconds remaining.</div>
                        <progress id="time-remaining-progress" class="horizontal" data-attr-value="timer_value" data-attr-max="timer_max" />
                    </span>
                </span>
            </div>
        </div>
    </body>
</rml>
