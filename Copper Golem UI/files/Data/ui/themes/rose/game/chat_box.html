    <script>

-- Chat message colours (steampunk add-on). Shared by options_bgfx.html (the
-- picker) and chat_box.html (the messages). Written inline because the game
-- ignores edited .lua files. Choices are saved to sp_chat_colors.txt.
local CHANNELS = {{id='chat', name='Chat', default='rgb(255, 255, 255)'}, {id='shout', name='Shout', default='rgb(255, 105, 105)'}, {id='whisper', name='Whisper', default='rgb(255, 158, 232)'}, {id='trade', name='Trade', default='rgb(0, 210, 50)'}, {id='party', name='Party', default='rgb(189, 250, 255)'}, {id='clan', name='Clan', default='rgb(255, 228, 122)'}, {id='group', name='Group', default='rgb(156, 175, 243)'}, {id='quest', name='Quest', default='rgb(151, 221, 241)'}, {id='system', name='System', default='rgb(255, 224, 229)'}}
local PALETTE = {{name='White', rgb='rgb(255, 255, 255)'}, {name='Parchment', rgb='rgb(226, 208, 170)'}, {name='Brass', rgb='rgb(203, 117, 74)'}, {name='Gold', rgb='rgb(242, 122, 62)'}, {name='Copper', rgb='rgb(127, 61, 185)'}, {name='Orange', rgb='rgb(152, 63, 230)'}, {name='Red', rgb='rgb(255, 90, 80)'}, {name='Pink', rgb='rgb(255, 150, 220)'}, {name='Purple', rgb='rgb(190, 150, 255)'}, {name='Blue', rgb='rgb(120, 170, 255)'}, {name='Cyan', rgb='rgb(120, 230, 240)'}, {name='Green', rgb='rgb(110, 220, 110)'}}
local SAVE_FILE = 'sp_chat_colors.txt'
local CHAT_ID = 'game-chat-box'
local picks = {}   -- channel id -> palette index (0 = game default)
pcall(function()
    local f = io.open(SAVE_FILE, 'r')
    if not f then return end
    for line in f:lines() do
        local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d+)')
        if k then picks[k] = math.max(0, math.min(#PALETTE, tonumber(v))) end
    end
    f:close()
end)
if _G and type(_G.SP_CHAT_PICKS) == 'table' then
    for k, v in pairs(_G.SP_CHAT_PICKS) do if picks[k] == nil then picks[k] = v end end
end
local function save()
    if _G then _G.SP_CHAT_PICKS = picks end
    pcall(function()
        local f = io.open(SAVE_FILE, 'w')
        if not f then return end
        for _, c in ipairs(CHANNELS) do f:write(c.id, '=', tostring(picks[c.id] or 0), '\n') end
        f:close()
    end)
end
-- Put class sp-<channel>-<n> on the chat window body
local function apply_to(doc)
    if not doc then return false end
    local body = doc:GetElementById(CHAT_ID)
    if not body then return false end
    for _, c in ipairs(CHANNELS) do
        for i = 1, #PALETTE do body:SetClass('sp-' .. c.id .. '-' .. i, (picks[c.id] or 0) == i) end
    end
    return true
end

if document:GetElementById('virtual-messages') then
    apply_to(document)
    local me = document
    if _G then _G.SP_CHAT_APPLY = function(p) if p then picks = p end; apply_to(me) end end
end

            </div>
        </div>

        <button id="chat-settings" class="settings" onclick="chat_settings" tooltip="Chat settings"></button>
        <handle id="mover" class="button-move" move_target="#document"></handle>
        <handle id="resizer" class="button-resize" size_target="#document"></handle>
    </body>
</rml>
