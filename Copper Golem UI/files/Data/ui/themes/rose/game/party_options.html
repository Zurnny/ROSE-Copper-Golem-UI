<rml>
    <head>
        <title>Party Options</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/spritesheet_steampunk.css" />
        <link type="text/rcss" href="../styles/steampunk.css" />
        <style>
            body { width: 340dp; max-width: 92vw; }
            .option-section { margin-bottom: 8dp; }
            .ui-section-title { display: block; }
            .sp-extras { margin-top: 8dp; padding-top: 8dp; border-top: 1dp rgb(116, 53, 22); }
        </style>
        <script>

-- Party HUD extras (steampunk add-on): buff icons on/off, buff icon size and
-- whether the title bar always shows (the game hides it until hovered). Set in party_options.html, applied in party.html, saved to
-- sp_party_hud.txt. Written inline because the game ignores edited .lua files.
local SAVE_FILE = 'sp_party_hud.txt'
local cfg = {buffs = 1, size = 100, keep = 0}
pcall(function()
    local f = io.open(SAVE_FILE, 'r')
    if not f then return end
    for line in f:lines() do
        local k, v = line:match('^%s*(%a+)%s*=%s*(%d+)')
        if k and cfg[k] ~= nil then cfg[k] = tonumber(v) end
    end
    f:close()
end)
cfg.size = math.max(50, math.min(200, math.floor(cfg.size / 10 + 0.5) * 10))
local function save()
    pcall(function()
        local f = io.open(SAVE_FILE, 'w')
        if not f then return end
        f:write('buffs=', cfg.buffs, '\n', 'size=', cfg.size, '\n', 'keep=', cfg.keep, '\n')
        f:close()
    end)
end
local function apply_to(doc)
    if not doc then return false end
    local body = doc:GetElementById('party')
    if not body or not doc:GetElementById('party-members') then return false end
    body:SetClass('sp-buffs-off', cfg.buffs == 0)
    body:SetClass('sp-title-keep', cfg.keep == 1)
    for s = 50, 200, 10 do body:SetClass('sp-buff-' .. s, cfg.size == s) end
    return true
end

pcall(function()
    local function el(id) return document:GetElementById(id) end
    -- A checkbox's state is its "checked" attribute
    local function is_checked(box) return box:HasAttribute('checked') end
    local function set_checked(box, on)
        if on then box:SetAttribute('checked', '') else box:RemoveAttribute('checked') end
    end
    local function show_size() local r = el('sp-buff-size-value'); if r then r.inner_rml = string.format('%d', math.floor(cfg.size + 0.5)) .. '%' end end
    local function push()
        save()
        local reached = false
        if _G and type(_G.SP_PARTY_HUD_APPLY) == 'function' then reached = pcall(_G.SP_PARTY_HUD_APPLY, cfg) end
        if not reached then
            pcall(function()
                local ctx = document.context
                reached = apply_to(ctx.documents['party'])
                if not reached then
                    for i = 0, #ctx.documents - 1 do
                        if apply_to(ctx.documents[i]) then reached = true break end
                    end
                end
            end)
        end
    end
    local buffs, size, keep = el('sp-buffs-on'), el('sp-buff-size'), el('sp-title-keep')
    if buffs then
        set_checked(buffs, cfg.buffs == 1)
        buffs:AddEventListener('change', function() cfg.buffs = is_checked(buffs) and 1 or 0; push() end)
    end
    if keep then
        set_checked(keep, cfg.keep == 1)
        keep:AddEventListener('change', function() cfg.keep = is_checked(keep) and 1 or 0; push() end)
    end
    if size then
        size:SetAttribute('value', tostring(cfg.size))
        show_size()
        size:AddEventListener('change', function(event)
            local v = tonumber(event.parameters and event.parameters.value) or tonumber(size:GetAttribute('value')) or cfg.size
            cfg.size = math.max(50, math.min(200, math.floor(v / 10 + 0.5) * 10))
            show_size()
            push()
        end)
    end
end)

        </script>
    </head>
    <body template="window-fixed-size" id="party-options" data-model="party-options">
        <div class="content-box ui-section option-section">
            <str class="ui-section-title" string-id="612">Experience Distribution</str>
            <label class="ui-choice-row"><input type="radio" id="exp-equal" name="exp-mode" value="0" data-checked="exp_mode" onchange="exp-mode" data-attrif-disabled="!can_edit_rules" /><str string-id="493">Equal</str></label>
            <label class="ui-choice-row"><input type="radio" id="exp-level" name="exp-mode" value="1" data-checked="exp_mode" onchange="exp-mode" data-attrif-disabled="!can_edit_rules" /><str string-id="492">Level-based</str></label>
        </div>
        <div class="content-box ui-section option-section">
            <str class="ui-section-title" string-id="489">Item Pickup Rights</str>
            <label class="ui-choice-row"><input type="radio" id="item-free" name="item-mode" value="0" data-checked="item_mode" onchange="item-mode" data-attrif-disabled="!can_edit_rules" /><str string-id="491">Free for all</str></label>
            <label class="ui-choice-row"><input type="radio" id="item-order" name="item-mode" value="1" data-checked="item_mode" onchange="item-mode" data-attrif-disabled="!can_edit_rules" /><str string-id="490">In order</str></label>
        </div>
        <label class="ui-choice-row"><input type="checkbox" id="show-member-hp" data-checked="show_member_hp" onchange="show-member-hp" /><str string-id="610">Show party member HP gauges</str></label>
        <div class="ui-range-setting">
            <label for="background-opacity"><span>Background opacity</span><span class="ui-detail-value">{{background_opacity}}%</span></label>
            <input id="background-opacity" type="range" min="0" max="100" step="5" data-value="background_opacity" onchange="appearance" />
        </div>
        <div class="ui-range-setting">
            <label for="party-scale"><span>Scale</span><span class="ui-detail-value">{{scale_percent}}%</span></label>
            <input id="party-scale" type="range" min="55" max="160" step="5" data-value="scale_percent" onchange="appearance" />
        </div>
        <!-- Steampunk extras (script at the end of <head>); saved to sp_party_hud.txt -->
        <div class="sp-extras">
            <label class="ui-choice-row"><input type="checkbox" id="sp-buffs-on" checked="" /><span>Show buff icons</span></label>
            <div class="ui-range-setting">
                <label for="sp-buff-size"><span>Buff icon size</span><span class="ui-detail-value" id="sp-buff-size-value">100%</span></label>
                <input id="sp-buff-size" type="range" min="50" max="200" step="10" value="100" />
            </div>
            <label class="ui-choice-row"><input type="checkbox" id="sp-title-keep" /><span>Always show title bar</span></label>
        </div>
        <div class="ui-actions ui-footer">
            <button class="default" id="confirm" onclick="confirm"><str string-id="858">Confirm</str></button>
            <button class="default" id="cancel" onclick="close"><str string-id="859">Cancel</str></button>
        </div>
    </body>
</rml>
