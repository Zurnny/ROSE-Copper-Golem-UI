<rml>
    <head>
        <title>Refine</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/spritesheet_steampunk.css" />
        <link type="text/rcss" href="../styles/steampunk.css" />
        <style>
            body { width: 340dp; max-width: 92vw; }
        </style>
    </head>
    <body template="window-fixed-size" id="refine">
        <div data-model="refine">
            <div class="content-box ui-section ui-item-row">
                <item-slot id="refine-target" class="default" />
                <div class="ui-item-details"><str string-id="788" class="ui-item-caption" /><span class="ui-section-title">{{target_name}}</span></div>
            </div>
            <div class="content-box ui-section ui-item-row">
                <item-slot id="refine-material-0" class="default" />
                <div class="ui-item-details"><str string-id="798" class="ui-item-caption" /><span class="ui-section-title">{{material0}}</span></div><span class="ui-item-amount">{{count[0]}}</span>
            </div>
            <div class="content-box ui-section ui-item-row">
                <item-slot id="refine-material-1" class="default" />
                <div class="ui-item-details"><str string-id="465" class="ui-section-title" /></div><span class="ui-item-amount">{{count[1]}}</span>
            </div>
            <div class="content-box ui-section ui-item-row">
                <item-slot id="refine-material-2" class="default" />
                <div class="ui-item-details"><str string-id="466" class="ui-section-title" /></div><span class="ui-item-amount">{{count[2]}}</span>
            </div>
            <div class="content-box ui-section ui-item-row">
                <item-slot id="refine-material-3" class="default" />
                <div class="ui-item-details"><str string-id="467" class="ui-section-title" /></div><span class="ui-item-amount">{{count[3]}}</span>
            </div>
            <div class="ui-footer">
                <div class="ui-detail-row"><str string-id="318" /><span class="ui-detail-value" id="refine-chance">{{chance}}</span></div>
                <div class="ui-detail-row"><span>{{cost_label}}</span><div class="ui-currency" data-class-mana="uses_mp"><img id="refine-currency" sprite="button-zulie-n" data-if="!uses_mp" /><span id="refine-cost">{{cost}}</span></div></div>
            </div>
            <span id="refine-status" class="ui-status ui-operation-status" data-if="status != ''">{{status}}</span>
            <div class="ui-actions ui-operation-actions"><button id="refine-begin" class="default accept" onclick="begin" data-attrif-disabled="busy"><str string-id="895" /></button></div>
        </div>
    </body>
</rml>
